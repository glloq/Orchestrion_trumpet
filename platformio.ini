; ============================================================================
;  Orchestrion Trumpet - ESP32 Modular MIDI Trumpet
;  PlatformIO project configuration
;
;  The firmware is a SINGLE binary that adapts at runtime to the hardware
;  described in the configuration file stored in LittleFS.  Nothing about the
;  DAC, the amplifier, the speaker or the valve actuators is decided here.
;
;  Two hardware targets are maintained:
;    * esp32dev          -> ESP32-WROOM-32  (no native USB, has internal DAC)
;    * esp32-s3-devkitc  -> ESP32-S3        (native USB, no internal DAC, PSRAM)
;  Plus a host-side `native` environment used to run the unit tests.
; ============================================================================

[platformio]
default_envs = esp32-s3-devkitc
extra_configs =
data_dir = data

; ---------------------------------------------------------------------------
; Common settings shared by every embedded environment
; ---------------------------------------------------------------------------
[env]
; pioarduino fork of the Espressif platform: required to get Arduino-ESP32 3.x
; (the upstream `espressif32` platform is frozen on Arduino-ESP32 2.0.17).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

; Every dependency is explicitly versioned.  The list is deliberately short:
; BLE MIDI, RTP-MIDI, the PCA9685 driver, the servo PWM generator and the
; audio codec drivers are implemented in-tree on top of the ESP-IDF/Arduino
; core so that the project does not drift when a third-party library breaks.
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    links2004/WebSockets @ ^2.6.1

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DOT_FIRMWARE_VERSION=\"1.0.0\"
    -DCORE_DEBUG_LEVEL=1
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
; ESP32-WROOM-32
;   Wi-Fi, BLE MIDI, DIN MIDI, I2S, Web UI, internal DAC.
;   NO native USB  ->  USB-MIDI class compliant is unavailable and is hidden
;   by the web UI (see BoardCaps).
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
; 4 MB modules cannot hold two OTA slots next to a ~2 MB firmware that carries
; BLE, Wi-Fi and the web UI, so this environment uses a single app partition.
; The firmware detects that at runtime and reports OTA as unavailable instead
; of showing a button that could not work.  See partitions/ for the details.
board_build.partitions = partitions/esp32_4mb_single_app.csv
build_flags =
    ${env.build_flags}
    -DOT_BOARD_ESP32=1

; Same chip on an 8 MB (or larger) module: OTA becomes available again.
[env:esp32dev_8mb]
board = esp32dev
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/esp32_8mb_ota.csv
build_flags =
    ${env.build_flags}
    -DOT_BOARD_ESP32=1

; ---------------------------------------------------------------------------
; ESP32-S3
;   Everything the WROOM does, plus native USB-MIDI (class compliant).
;   No internal DAC on the S3 -> that backend is hidden by the web UI.
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/default_8mb_ota.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DOT_BOARD_ESP32S3=1
    -DBOARD_HAS_PSRAM
    ; TinyUSB device stack, required for class compliant USB-MIDI.
    ; The board manifest defaults to the hardware CDC (mode 1); switching to
    ; mode 0 hands the USB peripheral to TinyUSB so USBMIDI can enumerate.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Host unit tests
;   Only the hardware independent logic is compiled here: configuration
;   parsing/migration/validation, MIDI parser + router, note priority,
;   fingering engine, servo/solenoid safety maths and the speaker limiter.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DOT_HOST_BUILD=1
    -DOT_FIRMWARE_VERSION=\"1.0.0\"
    -I src
    -I test/support
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
lib_compat_mode = off
build_src_filter = -<*>
