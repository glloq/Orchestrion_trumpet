<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Orchestrion Trumpet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎺</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-logo">🎺</div>
    <div class="boot-title">Orchestrion Trumpet</div>
    <div class="boot-sub" id="boot-sub">Connecting…</div>
  </div>
</div>

<header class="topbar">
  <button class="hamburger" id="nav-toggle" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="brand">
    <span class="brand-mark">🎺</span>
    <span class="brand-name" id="device-name">Orchestrion Trumpet</span>
  </div>
  <div class="topbar-status">
    <span class="badge" id="badge-mode" data-tone="neutral">…</span>
    <span class="badge" id="badge-link" data-tone="bad">Offline</span>
  </div>
  <button class="panic" id="btn-panic" title="Stop everything immediately">PANIC</button>
</header>

<div class="shell">
  <nav class="nav" id="nav">
    <a class="nav-item" data-page="dashboard"><span class="ico">◉</span>Dashboard</a>
    <a class="nav-item" data-page="play"><span class="ico">♪</span>Play</a>
    <a class="nav-item" data-page="midi"><span class="ico">⇄</span>MIDI</a>
    <a class="nav-item" data-page="instrument"><span class="ico">𝄞</span>Instrument</a>
    <a class="nav-item" data-page="audio"><span class="ico">≋</span>Audio</a>
    <a class="nav-item" data-page="pistons"><span class="ico">⋮⋮</span>Pistons</a>
    <a class="nav-item" data-page="hardware"><span class="ico">⚙</span>Hardware</a>
    <a class="nav-item" data-page="calibration"><span class="ico">◎</span>Calibration</a>
    <a class="nav-item" data-page="diagnostics"><span class="ico">▤</span>Diagnostics</a>
    <a class="nav-item" data-page="advanced"><span class="ico">⚑</span>Advanced</a>
    <a class="nav-item" data-page="firmware"><span class="ico">⇪</span>Firmware</a>
    <div class="nav-sep"></div>
    <a class="nav-item" data-page="wizard"><span class="ico">✦</span>Setup wizard</a>
    <div class="nav-foot">
      <div id="nav-fw">firmware —</div>
      <div id="nav-ip">—</div>
    </div>
  </nav>

  <main class="main" id="main">
    <section class="page" id="page-dashboard"></section>
    <section class="page" id="page-play"></section>
    <section class="page" id="page-midi"></section>
    <section class="page" id="page-instrument"></section>
    <section class="page" id="page-audio"></section>
    <section class="page" id="page-pistons"></section>
    <section class="page" id="page-hardware"></section>
    <section class="page" id="page-calibration"></section>
    <section class="page" id="page-diagnostics"></section>
    <section class="page" id="page-advanced"></section>
    <section class="page" id="page-firmware"></section>
    <section class="page" id="page-wizard"></section>
  </main>
</div>

<div class="savebar" id="savebar" hidden>
  <span id="savebar-text">Unsaved changes</span>
  <div class="savebar-actions">
    <button class="btn ghost" id="savebar-discard">Discard</button>
    <button class="btn primary" id="savebar-save">Save configuration</button>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/ws.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/pages.js"></script>
<script src="js/wizard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
