name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  firmware:
    name: firmware (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32-s3-devkitc, esp32dev, esp32dev_8mb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        # click 8.2 changed ParamType.get_metavar() to take a `ctx` argument.
        # The esptool bundled in tool-esptoolpy still calls the old signature,
        # so anything that runs esptool - including `buildfs` and the bootloader
        # step of an ordinary build - dies with:
        #
        #   TypeError: ParamType.get_metavar() missing 1 required positional
        #              argument: 'ctx'
        #
        # PlatformIO's own requirement is only `click<8.4`, which still lets
        # 8.2 and 8.3 in, so the pin has to be explicit and has to come after
        # platformio is installed. Remove it once tool-esptoolpy ships an
        # esptool built against click 8.2.
        run: |
          pip install --upgrade platformio
          pip install "click<8.2"
      - name: Build
        run: pio run -e ${{ matrix.environment }}
      - name: Build the LittleFS image
        run: pio run -e ${{ matrix.environment }} -t buildfs

  tests:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        # Same pin as above. The native environment does not run esptool, but
        # keeping the two jobs on the same toolchain means a failure here is
        # never explained by a different click.
        run: |
          pip install --upgrade platformio
          pip install "click<8.2"
      - name: Run the tests
        run: pio test -e native
